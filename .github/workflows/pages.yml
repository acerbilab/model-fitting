name: Deploy the hub

# Publishes site/ with GitHub Pages (source: GitHub Actions) on every push to main that
# touches it, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The films stay out of git: each comes from a release of this repository.
      - name: Fetch the films from their releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/media
          gh release download pybads-film --repo "$GITHUB_REPOSITORY" --pattern pybads-film.mp4 --dir site/media
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
